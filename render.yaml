services:
  - type: web
    name: kod-center-readonly
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: tradebot-web --config config.cloud.yaml --host 0.0.0.0 --port $PORT --cloud-readonly --dry-run --log-level INFO
    healthCheckPath: /healthz
    envVars:
      - key: KOD_DASHBOARD_PASSWORD
        sync: false
      - key: KOD_SECRET_KEY
        generateValue: true
