services:
  - type: web
    name: kod-center
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Render restarts the instance if this stops answering (crash / hang protection).
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      # Secrets: values are set in the Render dashboard (sync: false), never in git.
      # Without TELEGRAM_* the deployed app cannot send alerts (endpoint answers
      # "disabled: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID missing").
      # SCAN_TOKEN: shared secret with the GitHub Actions scanner (same value as the repo
      # secret SCAN_TOKEN). Without it /api/telegram/ready-alert is closed (fail-closed).
      - key: SCAN_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
